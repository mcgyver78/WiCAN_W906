name: Build Firmware (WiCAN OBD V300)

on:
  workflow_dispatch:
    inputs:
      min_free_bytes:
        description: 'Bytes that must stay free in the OTA slot (raise it to see the size guard fail)'
        default: '32768'
  push:
    paths:
      - 'main/**'
      - 'components/**'
      - 'CMakeLists.txt'
      - 'sdkconfig'
      - 'dependencies.lock'
      - 'wican_partitions_table.csv'
      - 'tools/w906/check_image_size.py'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - 'main/**'
      - 'components/**'
      - 'CMakeLists.txt'
      - 'sdkconfig'
      - 'dependencies.lock'
      - 'wican_partitions_table.csv'
      - 'tools/w906/check_image_size.py'
      - '.github/workflows/build-firmware.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32c3
          command: idf.py build

      - name: Image leaves room in the OTA slot
        run: python3 tools/w906/check_image_size.py --image "build/wican-fw_*.bin" --partitions wican_partitions_table.csv --min-free "${{ inputs.min_free_bytes || '32768' }}"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: wican-fw-obd-v300
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
