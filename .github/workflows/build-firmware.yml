name: Build Firmware (WiCAN OBD V300)

on:
  workflow_dispatch:
  push:
    paths:
      - 'main/**'
      - 'components/**'
      - 'CMakeLists.txt'
      - 'sdkconfig'
      - 'dependencies.lock'
      - 'wican_partitions_table.csv'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - 'main/**'
      - 'components/**'
      - 'CMakeLists.txt'
      - 'sdkconfig'
      - 'dependencies.lock'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32c3
          command: idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: wican-fw-obd-v300
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args

  analyzer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v
        working-directory: tools/w906
      - name: DTC decoder host test
        run: cc -Wall -Wextra -Werror -I../../main ../../main/dtc_decode.c dtc_decode_test.c -o dtc_decode_test && ./dtc_decode_test
        working-directory: tools/w906
