name: Display firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'display/**'
      - 'tools/w906/API.md'
      - 'tools/w906/fixtures/**'
      - 'vehicle_profiles/mercedes/sprinter_w906_om651.json'
      - '.github/workflows/display.yml'
  pull_request:
    paths:
      - 'display/**'
      - 'tools/w906/API.md'
      - 'tools/w906/fixtures/**'
      - 'vehicle_profiles/mercedes/sprinter_w906_om651.json'
      - '.github/workflows/display.yml'

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tool tests
        run: python -m unittest -v
        working-directory: display/tools
      - name: Partition table
        run: python display/tools/check_partitions.py --partitions display/partitions.csv --flash-size 16M
      - name: Logic host tests
        # -k: show what is wrong with every test, not only with the first
        run: make -k
        working-directory: display/test
      - name: Red proof counter-check (a change without effect is reported)
        run: python redproof.py --selftest
        working-directory: display/test

  # Every removed rule has to make a test fail. Thousands of builds: eight parts side by side.
  red-proof:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Red proof, part ${{ matrix.part }} of 8
        run: python redproof.py --shard ${{ matrix.part }}/8
        working-directory: display/test

  # Every kind of screen, and every scene the core makes in its host tests (display/test/fixtures), drawn by
  # LVGL without a display and checked (display/host/render.c). The log shows the screens as text; the
  # pictures are kept, because whether a screen reads well is seen, not tested.
  ui-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LVGL at the version of the firmware
        # The one version is named in display/main/idf_component.yml
        run: |
          version=$(sed -n 's/^ *version: "==\(.*\)"$/\1/p' display/main/idf_component.yml)
          test -n "$version"
          git clone --depth 1 --branch "v$version" https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
      - name: Render and check the screens
        run: make -j"$(nproc)" LVGL="$RUNNER_TEMP/lvgl"
        working-directory: display/host
      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wican-display-screens
          path: display/host/build/out/*.png
          if-no-files-found: ignore

  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: display
          command: idf.py build

      - name: Image leaves a fifth of its slot free
        run: python3 display/tools/check_partitions.py --partitions display/partitions.csv --flash-size 16M --image "display/build/wican-display.bin"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: wican-display
          path: |
            display/build/wican-display.bin
            display/build/bootloader/bootloader.bin
            display/build/partition_table/partition-table.bin
            display/build/ota_data_initial.bin
            display/build/flash_args
